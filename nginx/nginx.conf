upstream venone_app {
    server web.venone.io:5000;
}

server {

    listen 80;

    charset utf-8;
	keepalive_timeout 5;
	client_max_body_size 4G;

    location / {
		try_files $uri @proxy_to_app;
	}

    location @proxy_to_app {
        include proxy_params;
        if (!-f $request_filename) {
			proxy_pass http://venone_app;
			break;
		}
    }
}
